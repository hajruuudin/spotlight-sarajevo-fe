<section
  animate.enter="fade-in-animation"
  id="collectionHeaderContainer"
  class="w-full h-auto pt-3 pb-6 flex flex-col justify-start items-center space-y-4"
>
  <div
    id="collectionHeader"
    class="max-w-application px-4 md:px-8 flex flex-col justify-start items-center w-full"
  >
    <app-page-header
      class="max-w-application py-4"
      [title]="'collection.headerTitle' | transloco"
      [subtitle]="'collection.headerSubtitle' | transloco"
    ></app-page-header>
  </div>

  <div
    id="mainContainer"
    class="w-full h-auto pt-3 pb-6 flex flex-col justify-start items-center space-y-4"
  >
    <div
      id="main"
      class="max-w-application w-full px-4 md:px-8 flex flex-col md:flex-row justify-center items-start space-y-8 md:space-x-8 md:space-y-0"
    >
      <div id="collectionSelector" class="w-full md:w-1/3 flex flex-col rounded-2xl h-auto">
        <div class="w-full rounded-t-2xl h-auto flex flex-row">
          <div
            class="w-1/2 p-2 h-auto rounded-tl-2xl dark:bg-(--background-200) bg-(--background-800)"
          >
            <span class="text-lg font-bold">Spots</span>
          </div>
          <div
            class="w-1/2 p-2 h-auto rounded-tr-2xl dark:bg-(--background-200) bg-(--background-800)"
          >
            <span class="text-lg font-bold">Events</span>
          </div>
        </div>

        <div class="w-full h-auto bg-(--background-100) flex flex-row justify-between items-start">
          <!-- SPOT COLLECTION CONTAINER -->
          <div class="w-1/2 h-auto flex flex-col justify-start items-center">
            @for (collection of this.userSpotCollections; track collection.id) {
            <div
            (click)="this.fetchSelectedCollection(collection.id)"
            [ngClass]="this.selectedCollection.collectionId == collection.id ? 'bg-(--background-300) hover:bg-(--accent-300)' : 'bg-(--background-100) hover:bg-(--accent-300)'"
            class="w-full h-auto py-2 bg-(--background-100) hover:bg-(--accent-300)">
              <span class="text-lg font-normal">{{ collection.collectionName }}</span>
            </div>
            }
          </div>

          <!-- EVENT COLLECTION CONTAINER -->
          <div class="w-1/2 h-auto flex flex-col justify-start items-center">
            @for (collection of this.userEventCollections; track collection.id) {
            <div
            (click)="this.fetchSelectedCollection(collection.id)"
            [ngClass]="this.selectedCollection.collectionId == collection.id ? 'bg-(--background-200) hover:bg-(--accent-300)' : 'bg-(--background-100) hover:bg-(--accent-300)'"
            class="w-full h-auto py-2">
              <span 
              class="text-lg font-normal">{{ collection.collectionName }}</span>
            </div>
            }
          </div>
        </div>

        <section
          class="w-full rounded-b-2xl dark:bg-(--background-200) bg-(--background-700) h-auto py-2"
        ></section>

        <app-button-primary
          (click)="this.openAddCollectionModal()"
          classAddons="w-full rounded-2xl mt-8"
          [buttonContent]="'Add Collection'"
          [buttonType]="'DEFAULT'"
        ></app-button-primary>
      </div>
      <div id="itemsContainer" class="w-full md:w-2/3 rounded-2xl h-auto">
        @if (this.selectedCollection.collectionItems.length == 0) {
        <app-not-found-component
          [headerMessage]="'collection.noCollectionItemsHeading' | transloco"
          [messageDescription]="'collection.noCollectionItemsSubheading' | transloco"
        ></app-not-found-component>
        } @else {
          
        }
      </div>
    </div>
  </div>
</section>
