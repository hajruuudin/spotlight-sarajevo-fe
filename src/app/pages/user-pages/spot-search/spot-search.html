<section animate.enter="fade-in-animation" id="homepageHeadersSectionContainer"
    class="w-full h-auto pt-3 pb-6 flex flex-col justify-start items-center space-y-4">
    <app-page-header class="max-w-application pt-4" [title]='"search.searchSpotsTitle" | transloco'
        [subtitle]='"search.searchSpotsSubtitle" | transloco'></app-page-header>

    <div id="spotSearchContainer"
        class="max-w-application w-full flex flex-col md:flex-row justify-start md:justify-between items-center md:items-start px-4 md:px-8 space-y-4 md:space-y-0 md:space-x-4 overflow-scroll">
        <form [formGroup]="spotSearchForm" class="w-full h-auto flex flex-col justify-start items-stretch space-y-4">
            <app-search-bar formControlName="searchTerm" [placeholder]="'search.searchButton' | transloco"
                (search)="onSearchTriggered($event)"></app-search-bar>

            <section id="filterAndResultContainer" class="w-full flex flex-col justify-start items-stretch space-y-4">
                <div
                    class="w-full relative bg-(--background-200) px-2 md:px-0 rounded-2xl h-auto flex flex-col md:flex-row justify-center items-stretch">
                    <button (click)="this.toggleSortingPopup()"
                        class="w-full rounded-2xl dark:bg-(--background-300) my-2 my md:m-4 py-2 md:py-3 font-bold text-xl md:text-2xl">{{
                        'search.searchSorting' | transloco }}</button>
                    <!-- SORTING POPUP SECTION -->
                    @if (this.isSortingPopupLoaded) {
                    <div animate.enter="blink-in-animation" animate.leave="blink-out-animation"
                    (mouseleave)="this.toggleSortingPopup()"
                        style="box-shadow: 0px 0px 20px #00000055;"
                        class="transition-all absolute left-0 w-full md:w-1/2 h-auto rounded-2xl dark:bg-(--background-400) p-4 flex flex-col space-y-2 z-30 md:mr-4">
                        <div class="flex flex-col md:flex-row justify-between space-y-2 md:space-y-0 space-x-4">
                            @for (sorting of this.sortingMethods; track $index) {
                            <app-sorting-selector [sortingMethod]="'sorting.' + sorting | transloco"
                                [isSelected]="this.selectedSortingMethod == sorting"
                                (selectedMethod)="this.selectedSortingMethod = sorting"></app-sorting-selector>
                            }
                        </div>
                        <app-button-secondary (click)="this.toggleSortingPopup()"
                            [buttonContent]="'search.searchApply' | transloco"
                            [classAddons]="'px-6'"></app-button-secondary>
                    </div>
                    }

                    <button (click)="toggleFilterPopup()"
                        class="w-full rounded-2xl dark:bg-(--background-300) my-2 md:m-4 py-2 md:py-3 font-bold text-xl md:text-2xl">{{
                        'search.searchFilters' | transloco }}</button>
                    <!-- FILTER POPUP SECTION -->
                    @if (this.isFilterPopupLoaded) {
                    <div animate.enter="blink-in-animation" (mouseleave)="this.toggleFilterPopup()" animate.leave="blink-out-animation"
                        style="box-shadow: 0px 0px 20px #00000055;"
                        class="transition-all absolute right-0 top-0 w-full md:w-1/2 h-auto rounded-2xl dark:bg-(--background-400) p-4 flex flex-col space-y-4 z-30 md:ml-4">
                        <div
                            class="h-96 xl:h-auto flex flex-row flex-wrap justify-center space-x-4 space-y-2 xl:overflow-y-hidden overflow-y-scroll">
                            @for (category of this.spotCategories; track $index) {
                            <app-category-filter-selector
                                [categoryName]="this.getCurrentLanguage() == 'en' ? category.spotCategoryNameEn : category.spotCategoryNameBs"
                                [type]="'spot'" [isSelected]='this.selectedCategoryIds.indexOf(category.id) == -1 ? false : true'
                                (selectionChange)="onCategoryCheckboxChange(category.id)"></app-category-filter-selector>
                            }
                        </div>
                        <app-button-secondary (click)="this.toggleFilterPopup()"
                            [buttonContent]="'search.searchApply' | transloco"
                            [classAddons]="'px-6'"></app-button-secondary>
                    </div>
                    }
                </div>

                <div class="relative w-full flex flex-col lg:flex-row justify-center items-center space-x-0 lg:space-x-4">
                   
                    
                    <div class="w-full flex flex-col jusitfy-start items-center space-y-4 mb-2 md:mt-2">
                        @for (spot of this.spotSearchResults; track $index) {
                        <app-search-spot-card [lang]="this.lang" [spotShorthand]="spot"></app-search-spot-card>
                        }
                    </div>
                    <app-spinner-small-component [visible]="this.isSectionLoading()" message="Getting results"></app-spinner-small-component>
                    <div class="w-full flex flex-col jusitfy-start items-center space-y-4 mt-2 md:mt-0">
                        @for (spot of this.spotSearchResults; track $index) {
                        <app-search-spot-card [spotShorthand]="spot"></app-search-spot-card>
                        }
                    </div>
                    
                </div>
            </section>
        </form>
    </div>

</section>
