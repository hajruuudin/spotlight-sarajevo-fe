<section
    class="max-w-application w-full rounded-2xl dark:bg-(--background-200) bg-(--background-800) flex flex-col justify-center items-stretch"
>
    <div id="tableHeader" class="w-full dark:bg-(--primary-300) bg-(--primary-200) text-white p-2 rounded-t-2xl text-center text-xl font-extrabold">{{ this.tableHeader }}</div>

    <div id="tableBody" class="p-2">
        <div id="tableColumnHeaders" class="w-full flex flex-row justify-between items-center gap-4 p-2  border-(--primary-700)">
            @for (col of this.columnDefinitions; track $index) {
                <div class="text-lg font-bold w-auto">{{ col | transloco }}</div>
            }
        </div>
    </div>

    <div id="tableFooter" class="w-full dark:bg-(--primary-300) bg-(--primary-200) text-white rounded-b-2xl flex p-2 flex-row justify-between items-center">
        <div class="text-xl">Items {{ this.currentPage }} of {{ this.totalItems }}</div>
        <div class="flex flex-row gap-4">
            <app-button-primary
                [buttonContent]="'Previous Page'"
                [buttonType]="'DEFAULT'"
                (click)="previousPage()"
                [classAddons]="'p-2'"
                (disabled)="currentPage === 1"
            ></app-button-primary>
            <app-button-primary
                [buttonContent]="'Next Page'"
                [buttonType]="'DEFAULT'"
                [classAddons]="'p-2'"
                (click)="nextPage()"
                (disabled)="currentPage === this.maxPages"
            ></app-button-primary>
        </div>
    </div>

</section>
