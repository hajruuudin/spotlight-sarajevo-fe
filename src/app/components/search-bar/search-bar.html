<div class="relative flex w-full items-center rounded-2xl bg-[var(--background-400)] dark:bg-[var(--background-200)]">
  <input
    type="text"
    [value]="value"
    (input)="onInput($event)"
    [placeholder]="placeholder"
    class="py-4 md:py-6 px-4 w-full text-2xl font-semibold rounded-2xl focus:outline-2 focus:ring-0 focus:outline-[var(--primary-400)]"
  />
  <button
    type="button"
    (click)="onSearchPressed()"
    class="absolute right-0 h-full w-1/4 rounded-2xl flex items-center justify-center bg-[var(--background-700)] dark:bg-[var(--background-300)] hover:dark:bg-[var(--background-400)] transition-all"
  >
    <app-search-icon></app-search-icon>
    <span class="hidden md:inline text-2xl font-bold">{{ 'search.searchButton' | transloco }}</span>
  </button>
</div>
