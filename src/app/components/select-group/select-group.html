<div class="relative w-full">
  <div
    class="border-4 border-(--primary-300) bg-(--secondary-400) rounded-2xl px-4 py-2 font-bold cursor-pointer flex justify-between items-center"
    [class.opacity-50]="disabled"
    (click)="toggleDropdown()"
  >
    <span>{{ selectedLabel }}</span>
    <span class="arrow">{{ isOpen ? '▲' : '▼' }}</span>
  </div>

  @if (this.isOpen) {
  <ul
    class="absolute w-full mt-1 border-4 border-(--primary-400) rounded-2xl bg-(--primary-200) shadow-lg z-10 max-h-60 overflow-auto"
  >
    @for (option of this.options; track $index) {
    <li
      (click)="selectOption(option)"
      [class.text-white]="isSelected(option)"
      class="p-2 cursor-pointer hover:bg-(--accent-300) font-bold"
    >
      {{ option.label }}
    </li>
    }
  </ul>
  }
</div>
