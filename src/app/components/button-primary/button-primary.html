@if (this.buttonIcon == "DEFAULT") {
<button
  (click)="this.handleClick()"
  [ngClass]="
    this.classAddons +
    ' dark:bg-(--secondary-400) bg-(--secondary-500) h-12 rounded-2xl hover:bg-(--accent-800) transition-all font-semibold text-xl hover:dark:bg-(--accent-400)'
  "
>
  <span>{{ this.buttonContent }}</span>
</button>
}
